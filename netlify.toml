[build]
  command = "npm run build"
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200

[[redirects]]
  from = "/en"
  to = "/index.html?lang=en"
  status = 200

[[redirects]]
  from = "/en/"
  to = "/index.html?lang=en"
  status = 200

[[redirects]]
  from = "/sr"
  to = "/index.html?lang=sr"
  status = 200

[[redirects]]
  from = "/sr/"
  to = "/index.html?lang=sr"
  status = 200

[[redirects]]
  from = "/zh"
  to = "/index.html?lang=zh"
  status = 200

[[redirects]]
  from = "/zh/"
  to = "/index.html?lang=zh"
  status = 200

[[redirects]]
  from = "/ar"
  to = "/index.html?lang=ar"
  status = 200

[[redirects]]
  from = "/ar/"
  to = "/index.html?lang=ar"
  status = 200

[[redirects]]
  from = "/en/products"
  to = "/products.html?lang=en"
  status = 200

[[redirects]]
  from = "/sr/products"
  to = "/products.html?lang=sr"
  status = 200

[[redirects]]
  from = "/zh/products"
  to = "/products.html?lang=zh"
  status = 200

[[redirects]]
  from = "/ar/products"
  to = "/products.html?lang=ar"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; form-action 'self'; upgrade-insecure-requests"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
